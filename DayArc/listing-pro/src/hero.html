<!doctype html>
<html><head><meta charset="utf-8">
<!-- Store hero image (1440x720), DayArc Pro. Render: tools/render_listing_images.sh listing-pro. The three faces are the simulator captures in ../screens/ (simulator data, not readings). -->
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=Noto+Sans+SC:wght@400..800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1440px;height:720px;overflow:hidden;background:#2A2582;}
  body{display:flex;align-items:center;font-family:'Archivo','Noto Sans SC',sans-serif;color:#fff;
       background:radial-gradient(900px 640px at 72% 50%,rgba(130,110,255,.45) 0%,rgba(130,110,255,0) 70%),linear-gradient(160deg,#4B3BC4 0%,#2A2582 100%);}
  .copy{box-sizing:border-box;width:500px;padding-left:64px;padding-right:30px;flex:none;}
  .markbox{width:150px;height:112px;overflow:hidden;margin:0 0 20px -6px}
  .mark{width:150px;height:150px;display:block;margin-top:-11px}
  h1{margin:0;font-size:68px;font-weight:800;font-stretch:112%;letter-spacing:-2px;line-height:1;white-space:nowrap}
  h1 span:nth-child(1){color:#FFAA00}h1 span:nth-child(2){color:#55FFFF}h1 span:nth-child(3){color:#FF55AA}
  .name{display:flex;align-items:center;gap:12px}.pro{background:#fff;color:#000;border-radius:10px;padding:5px 11px 3px;font-size:28px;font-weight:800;font-stretch:112%;letter-spacing:1px;line-height:1.1;margin-top:10px}
  p{margin:26px 0 0;font-size:29px;line-height:1.3;color:#E6E3FB;font-weight:450;}
  .row{display:flex;align-items:flex-start;gap:26px;}
  .col{display:flex;flex-direction:column;align-items:center;width:276px}
  .w{border-radius:50%;overflow:hidden;background:#000;width:276px;height:276px;
     box-shadow:0 0 0 7px #1b1f25,0 0 0 9px #2f353d,0 26px 60px rgba(14,8,70,.55);}
  .w img{width:100%;height:100%;display:block;}
  .cap{margin-top:30px;text-align:center;line-height:1.15}
  .cap b{display:block;font-size:30px;font-weight:700;letter-spacing:.5px}
  .cap i{display:block;font-style:normal;font-size:25px;font-weight:500;margin-top:5px}
</style></head><body>
  <div class="copy">
    <div class="markbox"><img class="mark" src="mark.svg"></div>
    <div class="name"><h1>Day<span>A</span><span>r</span><span>c</span></h1><div class="pro">PRO</div></div>
    <p>The same day, in more detail.<br>As many readings as fit your watch&rsquo;s screen.</p>
  </div>
  <div class="row">
    <div class="col"><div class="w"><img src="../screens/1-morning.png"></div><div class="cap"><b>Morning</b><i style="color:#FFAA00">Weather</i></div></div>
    <div class="col"><div class="w"><img src="../screens/2-midday.png"></div><div class="cap"><b>Midday</b><i style="color:#55FFFF">Stress</i></div></div>
    <div class="col"><div class="w"><img src="../screens/3-evening.png"></div><div class="cap"><b>Evening</b><i style="color:#FF55AA">Body Battery</i></div></div>
  </div>
<script>
  // One hero per listing language (owner, 2026-10-08): hero.html#es and hero.html#zh swap the line and the captions; plain hero.html is English.
  var T = {es: ['El mismo día, con más detalle.<br>Tantas lecturas como quepan en la pantalla de tu reloj.', 'Mañana', 'Clima', 'Mediodía', 'Estrés', 'Tarde', 'Body Battery'],
           zh: ['同样的一天，更多细节。<br>手表屏幕放得下多少读数，<br>就显示多少。', '早晨', '天气', '中午', '压力', '傍晚', '身体电量']}[location.hash.slice(1)];
  if (T) {
    document.documentElement.lang = location.hash.slice(1); document.querySelector('.copy p').innerHTML = T[0];
    document.querySelectorAll('.cap').forEach(function (c, n) { c.querySelector('b').textContent = T[1 + 2 * n]; c.querySelector('i').textContent = T[2 + 2 * n]; });
  }
</script>
</body></html>
