<!doctype html>
<html><head><meta charset="utf-8">
<!-- Store cover (500x500): shows at ~100 px in browse, so mark + name only. DayArc Pro: the DayArc cover with a white PRO tag in the arc. -->
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:500px;height:500px;overflow:hidden;}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;
       font-family:'Archivo',sans-serif;color:#fff;background:radial-gradient(360px 360px at 50% 42%,#0d1a2a 0%,#000 75%);}
  .markbox{position:relative;width:340px;height:256px;overflow:hidden}
  .mark{width:340px;height:340px;display:block;margin-top:-24px;}
  .pro{position:absolute;left:50%;top:156px;transform:translateX(-50%);background:#fff;color:#000;border-radius:26px;padding:7px 24px 5px;
       font-size:44px;font-weight:800;font-stretch:112%;letter-spacing:2px;line-height:1.1}
  h1{margin:10px 0 0;font-size:92px;font-weight:800;font-stretch:112%;letter-spacing:-2px;line-height:1;}
  h1 span:nth-child(1){color:#FFAA00}h1 span:nth-child(2){color:#55FFFF}h1 span:nth-child(3){color:#FF55AA}
</style></head><body>
  <div class="markbox"><img class="mark" src="mark.svg"><div class="pro">PRO</div></div>
  <h1>Day<span>A</span><span>r</span><span>c</span></h1>
</body></html>
