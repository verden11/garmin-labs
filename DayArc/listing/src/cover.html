<!doctype html>
<html><head><meta charset="utf-8">
<!-- Store cover (500x500): shows at ~100 px in browse (indigo ground, never black: Garmin brand guidance, ROADMAP 10.25), so mark + name only. DayArc. -->
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:500px;height:500px;overflow:hidden;}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;
       font-family:'Archivo',sans-serif;color:#fff;background:linear-gradient(160deg,#4B3BC4 0%,#2A2582 100%);}
  .markbox{width:340px;height:256px;overflow:hidden}.mark{width:340px;height:340px;display:block;margin-top:-24px;}
  h1{margin:10px 0 0;font-size:92px;font-weight:800;font-stretch:112%;letter-spacing:-2px;line-height:1;}
  h1 span:nth-child(1){color:#FFAA00}h1 span:nth-child(2){color:#55FFFF}h1 span:nth-child(3){color:#FF55AA}
</style></head><body>
  <div class="markbox"><img class="mark" src="mark.svg"></div>
  <h1>Day<span>A</span><span>r</span><span>c</span></h1>
</body></html>
