<!doctype html>
<html><head><meta charset="utf-8">
<!-- Store cover (500x500, Two Suns (Free)): shows at ~100 px in browse, so the ring mark and the wordmark only.
     The mark is the face's own ring (noon at the top, daylight across the top half, ticks at sunrise and sunset, the sun).
     Free: the plain ring, no pill. Render: see ../screenshots.md. -->
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:500px;height:500px;overflow:hidden;}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;
       font-family:'Archivo',sans-serif;color:#fff;background:radial-gradient(360px 360px at 50% 42%,#0d1a2a 0%,#000 75%);}
  .mark{width:296px;height:296px;display:block;}
  h1{margin:22px 0 0;font-size:62px;font-weight:800;font-stretch:112%;letter-spacing:-2px;line-height:1;display:flex;align-items:center;gap:16px;}
  h1 .s{color:#55AAFF;}
  .pro{font-size:26px;font-weight:800;font-stretch:112%;letter-spacing:1px;line-height:1;color:#000;background:#FF5500;border-radius:8px;padding:7px 11px 6px;transform:translateY(2px);}
</style></head><body>
  <svg class="mark" viewBox="0 0 100 100"><path d="M92 50A42 42 0 0 1 8 50" fill="none" stroke="#5555AA" stroke-width="7"/><path d="M8 50A42 42 0 0 1 92 50" fill="none" stroke="#55AAFF" stroke-width="7"/><path d="M3.5 50H12.5M87.5 50H96.5" stroke="#fff" stroke-width="2.4"/><circle cx="20.3" cy="20.3" r="9" fill="#000"/><circle cx="20.3" cy="20.3" r="6.2" fill="#fff"/></svg>
  <h1><span>Two <span class="s">Suns</span></span></h1>
</body></html>
