<!doctype html>
<html><head><meta charset="utf-8">
<!-- Store cover (500x500, Two Suns Pro): shows at ~100 px in browse, so the ring mark and the wordmark only.
     The mark is the face's own ring (noon at the top, daylight across the top half, ticks at sunrise and sunset, the sun).
     Pro adds the golden-hour arcs and the PRO pill. Light/coloured ground (ROADMAP 10.25: Garmin's brand page says no black or transparent backgrounds). Render: see ../screenshots.md. -->
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:500px;height:500px;overflow:hidden;}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;
       font-family:'Archivo',sans-serif;color:#0B1530;background:#AA55FF;}
  .mark{width:296px;height:296px;display:block;}
  h1{margin:22px 0 0;font-size:58px;font-weight:800;font-stretch:112%;letter-spacing:-2px;line-height:1;display:flex;align-items:center;gap:16px;}
  h1 .s{color:#FFFFFF;}
  .pro{font-size:34px;font-weight:800;font-stretch:112%;letter-spacing:1px;line-height:1;color:#0B1530;background:#FF5500;border-radius:9px;padding:8px 13px 7px;transform:translateY(2px);}
</style></head><body>
  <svg class="mark" viewBox="0 0 100 100"><path d="M92 50A42 42 0 0 1 8 50" fill="none" stroke="#2B1370" stroke-width="7"/><path d="M8 50A42 42 0 0 1 92 50" fill="none" stroke="#FFFFFF" stroke-width="7"/><path d="M8 50A42 42 0 0 1 11.06 34.27" fill="none" stroke="#FF5500" stroke-width="7"/><path d="M88.94 34.27A42 42 0 0 1 92 50" fill="none" stroke="#FF5500" stroke-width="7"/><path d="M3.5 50H12.5M87.5 50H96.5" stroke="#0B1530" stroke-width="2.4"/><circle cx="20.3" cy="20.3" r="9" fill="#AA55FF"/><circle cx="20.3" cy="20.3" r="6.2" fill="#0B1530"/></svg>
  <h1><span>Two <span class="s">Suns</span></span><span class="pro">PRO</span></h1>
</body></html>
