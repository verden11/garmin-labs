<!doctype html>
<html><head><meta charset="utf-8">
<!-- Store hero image (1440x720, Two Suns Pro). Light/coloured ground (ROADMAP 10.25). Render: see ../screenshots.md. Screens are the simulator captures in ../screens/
     (fr965 and Instinct E 45 mm, canned data); the Instinct is doubled with nearest neighbour on a canvas, then scaled down smooth. -->
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1440px;height:720px;overflow:hidden;background:#AA55FF;}
  body{display:flex;align-items:center;justify-content:space-between;font-family:'Archivo',sans-serif;color:#0B1530;}
  .copy{box-sizing:border-box;width:470px;padding-left:56px;padding-right:8px;flex:none;}
  .mark{width:96px;height:96px;display:block;margin-bottom:24px;}
  h1{margin:0;font-size:58px;font-weight:800;font-stretch:112%;letter-spacing:-2px;line-height:1;display:flex;align-items:center;gap:14px;white-space:nowrap;}
  h1 .s{color:#FFFFFF;}
  .pro{font-size:26px;font-weight:800;font-stretch:112%;letter-spacing:1px;line-height:1;color:#0B1530;background:#FF5500;border-radius:8px;padding:7px 11px 6px;transform:translateY(2px);}
  p{margin:24px 0 0;font-size:27px;line-height:1.3;color:#0B1530;font-weight:500;}
  .screens{display:flex;align-items:center;gap:24px;padding-right:48px;}
  .w{overflow:hidden;background:#000;flex:none;box-shadow:0 0 0 7px #1b1f25,0 0 0 9px #2f353d,0 24px 50px rgba(40,0,90,.45);}
  .w img,.w canvas{width:100%;height:100%;display:block;}
  .d1{width:350px;height:350px;border-radius:50%;}
  .d2{width:262px;height:262px;border-radius:50%;}
  .d3{width:196px;height:196px;border-radius:28px;box-shadow:0 0 0 9px #1b1f25,0 0 0 11px #2f353d,0 24px 50px rgba(40,0,90,.45);}
</style></head><body>
  <div class="copy">
    <svg class="mark" viewBox="0 0 100 100"><path d="M92 50A42 42 0 0 1 8 50" fill="none" stroke="#2B1370" stroke-width="7"/><path d="M8 50A42 42 0 0 1 92 50" fill="none" stroke="#FFFFFF" stroke-width="7"/><path d="M8 50A42 42 0 0 1 11.06 34.27" fill="none" stroke="#FF5500" stroke-width="7"/><path d="M88.94 34.27A42 42 0 0 1 92 50" fill="none" stroke="#FF5500" stroke-width="7"/><path d="M3.5 50H12.5M87.5 50H96.5" stroke="#0B1530" stroke-width="2.4"/><circle cx="20.3" cy="20.3" r="9" fill="#AA55FF"/><circle cx="20.3" cy="20.3" r="6.2" fill="#0B1530"/></svg>
    <h1><span>Two <span class="s">Suns</span></span><span class="pro">PRO</span></h1>
    <p>The sky's day and your energy, on one dial.</p>
  </div>
  <div class="screens">
    <div class="w d1"><img src="../screens/1-day.png"></div><div class="w d2"><img src="../screens/2-golden-hour.png"></div>
    <div class="w d3"><canvas id="c" width="352" height="352"></canvas></div>
  </div>
<script>
  var i = new Image();
  i.onload = function () {
    var x = document.getElementById('c').getContext('2d');
    x.imageSmoothingEnabled = false; x.drawImage(i, 0, 0, 352, 352);
  };
  i.src = '../screens/4-instinct-e45.png';
</script>
</body></html>
