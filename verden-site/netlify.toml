[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # prerender.ts runs as native TypeScript.
  NODE_VERSION = "26"

# Vite content-hashes everything in /assets, so a file there never changes.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
