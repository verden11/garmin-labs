[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # prerender.ts runs as native TypeScript.
  NODE_VERSION = "26"

# Vite content-hashes everything in /assets, so a file there never changes.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # style-src needs 'unsafe-inline': React SSR emits inline style="" for
    # per-app accent colors (e.g. FacePreview). No inline/external script,
    # no data: URIs in the built CSS (checked before writing this).
    Content-Security-Policy = "default-src 'self'; img-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; form-action 'none'"
