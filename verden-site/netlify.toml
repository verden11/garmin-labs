[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # prerender.ts runs as native TypeScript.
  NODE_VERSION = "26"

# Vite content-hashes everything in /assets, so a file there never changes.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Report-only until a deploy preview shows no violations; then rename the
    # header to Content-Security-Policy. The site ships no scripts at all.
    Content-Security-Policy-Report-Only = "default-src 'none'; style-src 'self'; style-src-attr 'unsafe-inline'; font-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
