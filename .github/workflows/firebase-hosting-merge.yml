name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
    paths: ['site/**', '.github/workflows/firebase-hosting-*.yml']
# Never cancel a live deploy half-way; queue the next one instead.
concurrency:
  group: firebase-live
  cancel-in-progress: false
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci && npm run build
        working-directory: site
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VERDEN_WATCH_87DA4 }}
          channelId: live
          projectId: verden-watch-87da4
          entryPoint: site
