<!doctype html>
<html><head><meta charset="utf-8">
<!-- Store cover (500x500): shows at ~100 px in browse, so mark + name only. Flat amber ground (Garmin: no black or transparent
     backgrounds, ROADMAP 10.25): navy #0B1B33 on #FFAA00 is 9.0:1, "Set" #0A3FB0 on #FFAA00 is 4.7:1. -->
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:500px;height:500px;overflow:hidden;}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;
       font-family:'Archivo',sans-serif;color:#0B1B33;background:#FFAA00;}
  .mark{width:250px;height:258px;display:block;}
  h1{margin:24px 0 0;font-size:84px;font-weight:800;font-stretch:112%;letter-spacing:-2px;line-height:1;}
