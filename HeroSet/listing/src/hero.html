<!doctype html>
<html><head><meta charset="utf-8">
<!-- Store hero image (1440x720). Flat amber ground (Garmin: no black backgrounds, ROADMAP 10.25); navy text 9.0:1, "Set" blue 4.7:1. Render: see ../screenshots.md. -->
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1440px;height:720px;overflow:hidden;background:#FFAA00;}
  body{display:flex;align-items:center;font-family:'Archivo',sans-serif;color:#0B1B33;
       background:#FFAA00;}
  .copy{box-sizing:border-box;width:520px;padding-left:80px;}
  .mark{width:72px;height:74px;display:block;margin-bottom:24px;}
  h1{margin:0;font-size:84px;font-weight:800;font-stretch:112%;letter-spacing:-2px;line-height:1;}
  h1 span{color:#0A3FB0;}
  p{margin:24px 0 0;font-size:30px;line-height:1.3;color:#0B1B33;font-weight:500;}
  /* screens-framed/*.png are chassis+strap product shots with the white
     background already cut out (transparent). Drop-shadow follows the
     watch's real silhouette instead of a card rectangle. */
  .screens{display:flex;align-items:center;gap:24px;padding-right:40px;}
  .w{flex:none;filter:drop-shadow(0 30px 50px rgba(70,35,0,.45));}
  /* the straps are cut by the 720 px square: fade their ends out instead of a hard edge */
  .w img{width:100%;height:100%;object-fit:contain;display:block;
         -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 14%,#000 86%,transparent 100%);
         mask-image:linear-gradient(to bottom,transparent 0,#000 14%,#000 86%,transparent 100%);}
  .s{width:250px;height:250px;}
  .l{width:310px;height:310px;}
</style></head><body>
  <div class="copy">
    <svg class="mark" viewBox="2.5 2 60 61"><path d="M13 16L32.5 11L52 16L49 36Q48 45 32.5 54Q17 45 16 36Z" fill="#0B1B33" stroke="#0B1B33" stroke-width="4" stroke-linejoin="round"/><path d="M13 16L32.5 11L52 16L49 36Q48 45 32.5 54Q17 45 16 36Z" fill="#FFAA00"/><path d="M17 18L32.5 14L48 18L46 35Q45 42 32.5 50Q20 42 19 35Z" fill="#0B1B33"/><path d="M23 22H29V29H36V22H42L41 38L36 42V36L32.5 33L29 36V42L24 38Z" fill="#FFAA00"/></svg>
    <h1>Hero<span>Set</span></h1>
    <p>100 push-ups, 100 sit-ups and 100 squats a day, counted on your wrist.</p>
  </div>
  <div class="screens">
    <div class="w s"><img src="../screens-framed/1-dashboard.png"></div>
    <div class="w l"><img src="../screens-framed/2-counting.png"></div>
    <div class="w s"><img src="../screens-framed/5-instinct.png"></div>
  </div>
</body></html>
