<!doctype html>
<html><head><meta charset="utf-8">
<!-- Store hero image (1440x720), Pro tier. Render: see ../screenshots.md. Three simulator captures of the PRO build (../screens/): hours for a timed
     event, weeks with the steps line, days with the battery line. The mark is the launcher icon's own geometry plus the amber PRO badge that tells
     Pro from Free. Never the word "free", no price. Light/coloured ground (owner, 2026-10-04): Garmin's brand page says "Do not choose black or transparent backgrounds". Brand mint #55FFAA ground; ink #06261B arc, "1" and name; track #1FBF7A; "To Go" #0A6B43. The old dark one is in ../old/. A PROPOSAL until the owner approves the look. -->
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1440px;height:720px;overflow:hidden;background:#55FFAA;}
  body{display:flex;align-items:center;justify-content:space-between;font-family:'Archivo',sans-serif;color:#06261B;
       background:#55FFAA;}
  .copy{box-sizing:border-box;width:530px;padding-left:72px;padding-right:12px;flex:none;}
  .mark{width:110px;height:110px;display:block;margin:-5px 0 20px -5px;}
  h1{margin:0;font-size:66px;font-weight:800;font-stretch:112%;letter-spacing:-2px;line-height:1;white-space:nowrap;}
  h1 span{color:#0A6B43;}
  p{margin:24px 0 0;font-size:30px;line-height:1.3;color:#0B3B2A;font-weight:500;}
  .screens{display:flex;align-items:center;gap:26px;padding-right:30px;}
  .w{border-radius:50%;overflow:hidden;background:#000;flex:none;
     box-shadow:0 0 0 8px #1b1f25,0 0 0 10px #2f353d,0 24px 50px rgba(6,38,27,.35);}
  .w img{width:100%;height:100%;display:block;}
  .s{width:250px;height:250px;}
  .l{width:308px;height:308px;}
</style></head><body>
  <div class="copy">
    <svg class="mark" viewBox="0 0 65 65"><circle cx="32.5" cy="32.5" r="27" fill="none" stroke="#1FBF7A" stroke-width="5"/><path d="M32.5 5.5A27 27 0 1 1 8.553 44.972" fill="none" stroke="#06261B" stroke-width="5" stroke-linecap="round"/><path d="M28 22L35 17H39V48H34V24L29 27Z" fill="#06261B"/><rect x="35" y="45" width="29" height="17" rx="4.5" fill="#FFAA00" stroke="#55FFAA" stroke-width="3" paint-order="stroke"/><text x="49.5" y="57.6" text-anchor="middle" font-family="Archivo,Arial Black,Arial,sans-serif" font-weight="800" font-size="11.5" fill="#000" letter-spacing=".3">PRO</text></svg>
    <h1>Days <span>To Go</span></h1>
    <p>Hours for a timed event, and a battery or steps line.</p>
  </div>
  <div class="screens">
    <div class="w s"><img src="../screens/2-weeks-steps.png"></div>
    <div class="w l"><img src="../screens/1-to-the-minute.png"></div>
    <div class="w s"><img src="../screens/3-other-time-zone.png"></div>
  </div>
</body></html>
