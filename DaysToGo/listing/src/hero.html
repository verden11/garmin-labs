<!doctype html>
<html><head><meta charset="utf-8">
<!-- Store hero image (1440x720). Render: see ../screenshots.md.
     DaysToGo has no such thing yet (screenshots.md doesn't exist) — write it
     alongside the first real render, matching HeroFace's screenshots.md
     shape. Uses the existing real screen (../screens/1-countdown.png,
     454x454, already-uploaded style) — no new capture needed. -->
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1440px;height:720px;overflow:hidden;background:#000;}
  body{display:flex;align-items:center;justify-content:space-between;font-family:'Archivo',sans-serif;color:#fff;
       background:radial-gradient(900px 600px at 62% 50%,#0d1a2a 0%,#000 70%);}
  .copy{box-sizing:border-box;width:560px;padding-left:72px;padding-right:24px;}
  .mark{width:74px;height:74px;display:block;margin-bottom:24px;}
  h1{margin:0;font-size:72px;font-weight:800;font-stretch:112%;letter-spacing:-2px;line-height:1;}
  h1 span{color:#55FFAA;}
  p{margin:24px 0 0;font-size:30px;line-height:1.3;color:#cfd6df;font-weight:450;}
  .screens{display:flex;align-items:center;gap:20px;padding-right:120px;}
  .w{border-radius:50%;overflow:hidden;background:#000;flex:none;
     box-shadow:0 0 0 8px #1b1f25,0 0 0 10px #2f353d,0 30px 80px rgba(0,0,0,.8);}
  .w img{width:100%;height:100%;display:block;}
  .l{width:460px;height:460px;}
</style></head><body>
  <div class="copy">
    <!-- The ring drain + big number, DaysToGo's own real visual vocabulary (DaysToGoRing/DaysToGoPalette
         accent-mint), not an invented mark — same draft/sign-off status as TwoSuns'. -->
    <svg class="mark" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="42" fill="none" stroke="#555555" stroke-width="7"/>
      <path d="M50 8A42 42 0 1 1 11.483 66.746" fill="none" stroke="#55FFAA" stroke-width="7" stroke-linecap="round"/>
    </svg>
    <h1>Days <span>To Go</span></h1>
    <p>One big number for the days left until your date.</p>
  </div>
  <div class="screens">
    <div class="w l"><img src="../screens/1-countdown.png"></div>
  </div>
</body></html>
