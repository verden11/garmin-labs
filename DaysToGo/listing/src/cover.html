<!doctype html>
<html><head><meta charset="utf-8">
<!-- Store cover (500x500), Pro tier: shows at ~100 px in browse, so mark + name only. The mark is the launcher icon's own geometry (resources/drawables/launcher_icon.svg) plus the amber PRO badge that tells Pro from Free. Light/coloured ground (owner, 2026-10-04): Garmin's brand page says "Do not choose black or transparent backgrounds". Brand mint #55FFAA ground; ink #06261B arc, "1" and name; track #1FBF7A; "To Go" #0A6B43. The old dark one is in ../old/. A PROPOSAL until the owner approves the look. -->
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:500px;height:500px;overflow:hidden;}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Archivo',sans-serif;background:#55FFAA;}
  .mark{width:250px;height:250px;display:block;overflow:visible;}
  h1{margin:30px 0 0;font-size:70px;font-weight:800;font-stretch:112%;letter-spacing:-2px;line-height:1;white-space:nowrap;color:#06261B;}
  h1 span{color:#0A6B43;}
</style></head><body>
  <svg class="mark" viewBox="0 0 65 65"><circle cx="32.5" cy="32.5" r="27" fill="none" stroke="#1FBF7A" stroke-width="5"/><path d="M32.5 5.5A27 27 0 1 1 8.553 44.972" fill="none" stroke="#06261B" stroke-width="5" stroke-linecap="round"/><path d="M28 22L35 17H39V48H34V24L29 27Z" fill="#06261B"/><rect x="35" y="45" width="29" height="17" rx="4.5" fill="#FFAA00" stroke="#55FFAA" stroke-width="3" paint-order="stroke"/><text x="49.5" y="57.6" text-anchor="middle" font-family="Archivo,Arial Black,Arial,sans-serif" font-weight="800" font-size="11.5" fill="#000" letter-spacing=".3">PRO</text></svg>
  <h1>Days <span>To Go</span></h1>
</body></html>
