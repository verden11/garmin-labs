<!doctype html>
<html><head><meta charset="utf-8">
<!-- Store cover (500x500), Pro tier: shows at ~100 px in browse, so mark + name only. The mark is the launcher icon's own geometry
     (resources/drawables/launcher_icon.svg) plus the amber PRO badge that tells Pro from Free (the Free cover is the same page without it).
     A PROPOSAL until the owner approves the look. The previous cover (a direct face render) is in ../old/. -->
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:500px;height:500px;overflow:hidden;}

       font-family:'Archivo',sans-serif;color:#fff;background:radial-gradient(360px 360px at 50% 45%,#0d1a2a 0%,#000 75%);}
